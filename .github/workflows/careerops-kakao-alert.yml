name: CareerOps A-grade Kakao Alerts

on:
  schedule:
    # 23:00 UTC = 08:00 Asia/Seoul on the following day
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: careerops-kakao-alert
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    # Installation, search, education verification, and Kakao delivery all share
    # this job budget. Keep it comfortably above the script's own search budget.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Restore alert history and encrypted PlayMCP session
        id: alert-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .github/career-alert-state.json
            .github/secure-cache/mcporter-credentials.enc
          key: career-alert-state-${{ github.run_id }}
          restore-keys: |
            career-alert-state-

      - name: Install and configure PlayMCP client
        env:
          MCPORTER_CREDENTIALS_B64: ${{ secrets.MCPORTER_CREDENTIALS_B64 }}
        run: |
          test -n "$MCPORTER_CREDENTIALS_B64" || { echo "Missing MCPORTER_CREDENTIALS_B64 secret"; exit 1; }
          npm install --global mcporter@0.13.0
          mcporter config add mcp-gateway https://playmcp.kakao.com/mcp --auth oauth --scope home
          mkdir -p "$HOME/.mcporter" .github/secure-cache
          if test -s .github/secure-cache/mcporter-credentials.enc; then
            if ! openssl enc -d -aes-256-cbc -pbkdf2 \
              -in .github/secure-cache/mcporter-credentials.enc \
              -out "$HOME/.mcporter/credentials.json" \
              -pass env:MCPORTER_CREDENTIALS_B64; then
              echo "Encrypted credential cache could not be decrypted; using the GitHub Secret seed."
              printf '%s' "$MCPORTER_CREDENTIALS_B64" | base64 --decode > "$HOME/.mcporter/credentials.json"
            fi
          else
            printf '%s' "$MCPORTER_CREDENTIALS_B64" | base64 --decode > "$HOME/.mcporter/credentials.json"
          fi
          chmod 600 "$HOME/.mcporter/credentials.json"

      - name: Search, rank, and notify new A-grade jobs
        timeout-minutes: 12
        env:
          ALERT_STATE_PATH: .github/career-alert-state.json
        run: node .github/scripts/career-alert.mjs

      - name: Encrypt refreshed PlayMCP session
        if: always()
        env:
          MCPORTER_CREDENTIALS_B64: ${{ secrets.MCPORTER_CREDENTIALS_B64 }}
        run: |
          if test -s "$HOME/.mcporter/credentials.json"; then
            mkdir -p .github/secure-cache
            openssl enc -aes-256-cbc -salt -pbkdf2 \
              -in "$HOME/.mcporter/credentials.json" \
              -out .github/secure-cache/mcporter-credentials.enc \
              -pass env:MCPORTER_CREDENTIALS_B64
          fi

      - name: Save alert history and encrypted PlayMCP session
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .github/career-alert-state.json
            .github/secure-cache/mcporter-credentials.enc
          key: career-alert-state-${{ github.run_id }}
